server {
    listen 80;
    client_max_body_size 2G;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_request_buffering off;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend:80;
    }
}

