[project]
name = "autoclip-transform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.14.1",
  "celery[redis]==5.4.0",
  "fastapi==0.115.8",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.4",
  "pydantic-settings==2.7.1",
  "python-multipart==0.0.20",
  "sqlalchemy==2.0.37",
  "structlog==24.4.0",
  "uvicorn[standard]==0.34.0",
  "yt-dlp>=2025.1.15,<2027",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.9.4",
]
openai = ["openai>=1.60,<2"]
whisper = ["faster-whisper>=1.1,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
